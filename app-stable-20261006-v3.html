<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><title>Gesundheits-Timeline</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f1ea;color:#20241f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(430px,100%);min-height:min(850px,calc(100vh - 36px));background:#faf7ef;border:1px solid #d8cfbf;border-radius:30px;padding:18px;box-shadow:0 22px 70px rgba(32,36,31,.16)}.profile{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#fffdf8;border:1px solid #ddd4c4;border-radius:20px;padding:12px;margin-bottom:18px}.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:999px;background:#277465;color:white;font-size:13px;font-weight:800;text-decoration:none}.label{display:block;color:#697064;font-size:11px;margin-bottom:2px}.name{font-size:16px;font-weight:800}.flag{font-size:18px}h1{margin:0 0 6px;font-size:25px;line-height:1.08}.sub{margin:0 0 18px;color:#697064;font-size:13px;line-height:1.4}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:15px}.tab{border:1px solid #ddd4c4;background:#fffdf8;color:#20241f;border-radius:999px;padding:9px 4px;font-size:13px;font-weight:800;text-decoration:none;text-align:center}.tab.active{background:#20241f;border-color:#20241f;color:#f9f6ee}.stack{display:grid;gap:10px}.card{background:#fffdf8;border:1px solid #ddd4c4;border-radius:20px;padding:14px}.row{display:grid;grid-template-columns:50px 1fr;gap:12px;align-items:start}.icon{display:grid;place-items:center;width:50px;min-height:50px;border-radius:15px;background:#e5f2ed;color:#15574c;font-size:13px;font-weight:800;text-align:center}.icon svg{width:27px;height:27px;display:block}.doctolib-icon{background:#e5f2ed}.doctolib-appicon{width:38px;height:38px;border-radius:11px;filter:drop-shadow(0 2px 3px rgba(32,36,31,.18))}b{display:block;margin-bottom:4px;font-size:15px}span,p{color:#697064;font-size:12px;line-height:1.4}.privacy{background:#eef4f2;border-color:#cbded8}.pill-row{display:flex;gap:8px;flex-wrap:wrap}.tiny{border:1px solid #ddd4c4;background:#fffdf8;color:#697064;border-radius:999px;padding:7px 10px;font-size:12px;text-decoration:none}.tiny.active-filter{background:#20241f;color:#fff;border-color:#20241f}.field{width:100%;border:1px solid #ddd4c4;border-radius:12px;background:#fffdf8;padding:10px;color:#20241f}.import-code{min-height:86px;resize:vertical}.import-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.action-btn{border:1px solid #277465;border-radius:999px;padding:9px 12px;background:#277465;color:white;font-size:12px;font-weight:800}.action-btn.secondary{background:#fffdf8;color:#15574c}.empty{color:#697064;text-align:center;padding:22px}.group{display:grid;gap:8px}.group-title{margin:8px 2px 0;color:#15574c;font-size:13px;font-weight:900}.group-count{color:#8b8f86;font-size:11px;font-weight:700;margin-left:4px}.vaccine-card{padding:12px 14px}.vaccine-card b{font-size:14px}.meta-line{display:block;color:#697064;font-size:12px;line-height:1.4}.status-ok{color:#15574c;font-weight:800}.status-check{color:#8a5a16;font-weight:800}.reminder{margin-top:5px;color:#697064;font-size:12px}.mini-calendar{display:grid;gap:8px}.cal-head{display:flex;align-items:center;justify-content:space-between;color:#697064;font-size:12px;font-weight:800}.nav-btn{width:30px;height:30px;border:1px solid #ddd4c4;background:#fffdf8;border-radius:999px;color:#20241f;font-size:18px;line-height:1;text-decoration:none;text-align:center}.date-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.date-pill{border:1px solid #ddd4c4;background:#fffdf8;border-radius:12px;padding:6px 2px;text-align:center}.date-pill b{margin:0;font-size:13px}.date-pill span{display:block;font-size:10px}.link-action{color:#15574c;font-size:12px;font-weight:800;text-decoration:underline;text-underline-offset:3px}.details{margin-top:10px;padding-top:10px;border-top:1px solid #ece4d6;color:#697064;font-size:12px;line-height:1.45}
</style></head><body><main class="app"><section class="profile"><a class="avatar" href="?view=alle">TV</a><div><span class="label">Profil</span><span class="name">Tuba Vogel</span></div><span class="flag">🇩🇪⌄</span></section><h1>Gesundheits-Timeline</h1><p class="sub" id="subtitle">Vorsorge, Impfausweis und Termine an einem Ort.</p><nav class="tabs" aria-label="Ansicht" id="tabs"></nav><section class="stack" id="content" aria-live="polite"></section></main><script>
(function(){const storageKey="gesundheits-prototyp-vaccinations-v1";const vaccineNames={ty:"Typhus - TYPHIM Vi",gf:"Gelbfieber - Stamaril",tw:"Tollwut - Rabipur",hpv:"HPV - Gardasil 9",po:"Polio - IPV Merieux",pn:"Pneumokokken - Prevenar 20",hb:"Hepatitis B",hbe:"Hepatitis B - Engerix-B Erwachsene",haq:"Hepatitis A - VAQTA",hah:"Hepatitis A - Havrix 1440",bcg:"BCG / Tuberkulose",mmr:"MMR - Masern, Mumps, Roeteln",dtp:"Diphtherie/Tetanus/Pertussis - Boostrix",cov:"COVID-19 - Comirnaty"};const groupOrder=["Reiseimpfungen","HPV","Hepatitis","Standardimpfungen","COVID / zu prüfen","Ältere Einträge"];const topics=["Alle","Masern","Hepatitis A","Hepatitis B","HPV","Tollwut","Gelbfieber","Typhus","Polio","COVID","Tetanus"];const toothIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.4 3.6c1.3 0 2.3.7 3.6.7s2.3-.7 3.6-.7c2.5 0 4.1 2.1 4.1 4.8 0 2.1-.8 3.8-1.5 5.4-.8 1.8-1.1 4.7-2.3 5.8-.7.7-1.7.4-2-.6l-.8-3.6c-.2-.9-.7-1.3-1.1-1.3s-.9.4-1.1 1.3L10.1 19c-.3 1-1.3 1.3-2 .6-1.2-1.1-1.5-4-2.3-5.8-.7-1.6-1.5-3.3-1.5-5.4 0-2.7 1.6-4.8 4.1-4.8z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';const doctolibIcon='<svg class="doctolib-appicon" viewBox="0 0 64 64" aria-label="Doctolib"><defs><linearGradient id="dg" x1="8" y1="8" x2="56" y2="56"><stop stop-color="#1aa7ef"/><stop offset="1" stop-color="#087bd8"/></linearGradient></defs><rect x="5" y="5" width="54" height="54" rx="14" fill="url(#dg)"/><path d="M20.5 40.5c8.9-1 19.5-4.5 22.2-12.2 2.1-5.9-2.4-10.1-10.4-9.4-5.5.5-10.1 2.2-13.9 4" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><path d="M28 18.8c-1.8 7.4-3.2 14.8-4.1 22.6" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/></svg>';const content=document.getElementById("content"),tabs=document.getElementById("tabs"),subtitle=document.getElementById("subtitle");const params=new URLSearchParams(location.search);let view=params.get("view")||"termine";let q=params.get("q")||"";const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function link(v,label){return`<a class="tab ${view===v?"active":""}" href="?view=${v}&_=${Date.now()}">${label}</a>`}function renderTabs(){tabs.innerHTML=link("alle","Alle")+link("faellig","Fällig")+link("impfausweis","Impfausweis")+link("termine","Termine")}function decodePayload(value){const base64=value.replace(/-/g,"+").replace(/_/g,"/");const padded=base64+"===".slice((base64.length+3)%4);const binary=atob(padded);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}function normalize(items){return Array.isArray(items)?items.map((item,index)=>Array.isArray(item)?{id:`private-vaccine-${index+1}`,name:vaccineNames[item[0]]||item[0]||"Impfung",date:item[1]||"Datum offen",note:""}:{id:item.id||`private-vaccine-${index+1}`,name:item.name||item.n||"Impfung",date:item.date||item.d||"Datum offen",note:item.note||""}):[]}function encodePayload(items){const bytes=new TextEncoder().encode(JSON.stringify(items));let binary="";bytes.forEach(b=>binary+=String.fromCharCode(b));return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}function setImportNotice(text){const el=document.getElementById("importNotice");if(el)el.textContent=text}function copyPrivateImport(){const all=load();if(!all.length){setImportNotice("Keine Impfungen zum Kopieren vorhanden.");return}const code=encodePayload(all);const field=document.getElementById("privateImportCode");if(field)field.value=code;const done=()=>setImportNotice("Import-Code kopiert. Öffne die Home-App, Impfausweis, Code einfügen.");if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done).catch(()=>{if(field){field.focus();field.select()}setImportNotice("Code markieren und kopieren.")})}else{if(field){field.focus();field.select()}setImportNotice("Code markieren und kopieren.")}}function pastePrivateImport(){const field=document.getElementById("privateImportCode");const code=(field&&field.value||"").trim();if(!code){setImportNotice("Bitte Import-Code einfügen.");return}try{const items=normalize(decodePayload(code));if(!items.length)throw new Error("empty");localStorage.setItem(storageKey,JSON.stringify(items));location.replace(location.pathname+"?view=impfausweis&loaded="+Date.now())}catch(e){setImportNotice("Code konnte nicht gelesen werden. Bitte aus Safari neu kopieren.")}}window.copyPrivateImport=copyPrivateImport;window.pastePrivateImport=pastePrivateImport;function importHash(){try{const hash=new URLSearchParams(location.hash.slice(1));const payload=hash.get("c")||hash.get("v")||hash.get("vaccinations");if(!payload)return false;localStorage.setItem(storageKey,JSON.stringify(normalize(decodePayload(payload))));view="impfausweis";subtitle.textContent="Vorsorge, Impfausweis und Termine an einem Ort. Impfpass lokal importiert.";history.replaceState(null,"",location.pathname+"?view=impfausweis&loaded="+Date.now());return true}catch(e){subtitle.textContent="Import konnte nicht gelesen werden. Bitte neuen Import-Link öffnen.";return false}}function load(){try{return JSON.parse(localStorage.getItem(storageKey)||"[]")}catch{return[]}}function category(x){const h=[x.name,x.note].join(" ").toLowerCase();if(/typh|gelbfieber|tollwut|rabipur|stamaril|polio|pneumo|prevenar/.test(h))return"Reiseimpfungen";if(/hpv|gardasil/.test(h))return"HPV";if(/hepatitis/.test(h))return"Hepatitis";if(/covid|comirnaty/.test(h))return"COVID / zu prüfen";if(/mmr|masern|mumps|roeteln|röteln|tetanus|diphtherie|pertussis|boostrix/.test(h))return"Standardimpfungen";return"Ältere Einträge"}function insight(x,all){const h=[x.name,x.note].join(" ").toLowerCase();const y=Number((String(x.date).match(/(19|20)\d{2}$/)||[])[0]);const count=n=>all.filter(v=>[v.name,v.note].join(" ").toLowerCase().includes(n)).length;let status="Immunisierung dokumentiert",reminder="Erinnerung: bei nächstem Arzttermin Impfstatus prüfen";if(/typh|typhim/.test(h)){status="Reiseimpfung dokumentiert";reminder=y?`Erinnerung ${y+3}: Typhus vor Reise prüfen`:"Typhus vor Reise prüfen"}else if(/tollwut|rabipur/.test(h)){reminder=y?`Erinnerung ${y+2}: vor Reise oder Risiko Titer/Auffrischung prüfen`:"Vor Reise oder Risiko Titer/Auffrischung prüfen"}else if(/gelbfieber|stamaril/.test(h)){reminder=y?`Zertifikat meist lebenslang; ${y+10} bei erneuter Exposition ärztlich prüfen`:"Einreisevorgaben vor Reise prüfen"}else if(/hpv|gardasil/.test(h)){status=count("hpv")>=3?"Immunisierung wahrscheinlich vollständig dokumentiert":"Immunisierung noch unvollständig prüfen";reminder=count("hpv")>=3?"Keine routinemäßige Auffrischung geplant":"Fehlende Dosis ärztlich klären"}else if(/hepatitis a/.test(h)){status=count("hepatitis a")>=2?"Grundimmunisierung dokumentiert":"Grundimmunisierung prüfen";reminder=y?`Langzeitschutz dokumentiert; Erinnerung ${y+25} bei Reise/Risiko prüfen`:"Bei Reise/Risiko ärztlich prüfen"}else if(/hepatitis b/.test(h)){status=count("hepatitis b")>=3?"Grundimmunisierung dokumentiert":"Grundimmunisierung prüfen";reminder="Kein fixer Auffrischtermin; bei Risiko Titer/Auffrischung prüfen"}else if(/boostrix|tetanus|diphtherie|pertussis/.test(h)){status="Schutz dokumentiert";reminder=y?`Erinnerung ${y+10}: Tetanus/Diphtherie-Auffrischung prüfen`:"10-Jahres-Rhythmus prüfen"}else if(/mmr|masern|mumps|roeteln|röteln/.test(h)){status=count("mmr")>=2?"Immunisierung dokumentiert":"Immunisierung prüfen";reminder="Keine routinemäßige Auffrischung; bei unklarem Status prüfen"}else if(/polio|ipv/.test(h)){reminder=y?`Erinnerung ${y+10}: Polio bei Reise-/Expositionsrisiko prüfen`:"Polio bei Reise-/Expositionsrisiko prüfen"}else if(/pneumo|prevenar/.test(h)){reminder="Bedarf abhängig von Alter/Risiko ärztlich prüfen"}else if(/covid|comirnaty/.test(h)){status="COVID-Impfung dokumentiert";reminder="Jährlich im Herbst prüfen, falls Risiko oder aktuelle Empfehlung zutrifft"}else if(/bcg|tuberkulose/.test(h)){reminder="Keine Standard-Auffrischung geplant"}return{status,reminder}}function card(x,all){const i=insight(x,all);return`<article class="card vaccine-card"><b>${esc(x.name)}</b><span>${esc(x.date)}</span><div class="meta-line ${i.status.includes("prüfen")||i.status.includes("unvollständig")?"status-check":"status-ok"}">${esc(i.status)}</div><div class="reminder">${esc(i.reminder)}</div></article>`}function vaccines(){const all=load();const transfer=all.length?`<article class="card"><b>Private Übernahme</b><span>Für die Home-App: diesen Code in Safari kopieren und im Impfausweis der Home-App einfügen. Die Daten bleiben lokal auf deinem Gerät.</span><textarea id="privateImportCode" class="field import-code" readonly>${esc(encodePayload(all))}</textarea><div class="import-actions"><button class="action-btn" type="button" onclick="copyPrivateImport()">Import-Code kopieren</button></div><p id="importNotice" class="reminder"></p></article>`:`<article class="card"><b>Private Übernahme</b><span>Wenn die Impfungen in Safari sichtbar sind: dort den Import-Code kopieren, hier einfügen und übernehmen.</span><textarea id="privateImportCode" class="field import-code" placeholder="Import-Code hier einfügen"></textarea><div class="import-actions"><button class="action-btn" type="button" onclick="pastePrivateImport()">Impfungen übernehmen</button></div><p id="importNotice" class="reminder"></p></article>`;const filtered=all.filter(x=>[x.name,x.date,x.note].join(" ").toLowerCase().includes(q.toLowerCase()));const groups=new Map();filtered.forEach(x=>{const k=category(x);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});content.innerHTML=`<article class="card"><div class="row"><div class="icon">I</div><div><b>Impfausweis</b><span>Impfungen nach Thema durchsuchen, Immunisierung einschätzen und Erinnerungen vormerken.</span></div></div></article><article class="card privacy"><b>Privater Speicher</b><span>Deine echten Impfdaten bleiben lokal auf diesem Gerät. Foto-Quellen und Lesbarkeitsnotizen werden hier nicht angezeigt.</span></article>${transfer}<article class="card"><input class="field" placeholder="Suchen, z. B. Masern, Hepatitis B, Tollwut" value="${esc(q)}" readonly><div class="pill-row">${topics.map(t=>{const query=t==="Alle"?"":t;return`<a class="tiny ${q===query?"active-filter":""}" href="?view=impfausweis&q=${encodeURIComponent(query)}&_=${Date.now()}">${esc(t)}</a>`}).join("")}</div></article>${filtered.length?groupOrder.filter(k=>groups.has(k)).map(k=>`<section class="group"><div class="group-title">${esc(k)} <span class="group-count">${groups.get(k).length}</span></div>${groups.get(k).map(x=>card(x,all)).join("")}</section>`).join(""):`<p class="empty">Keine Impfpass-Einträge auf diesem Gerät.</p>`}`}function areas(){content.innerHTML=`<article class="card"><div class="row"><div class="icon">${toothIcon}</div><div><b>Zahnarzt</b><span>Zuletzt: Zahnreinigung 29. Sept. 2026 · nächste Kontrolle in 6 Monaten planen</span><div class="details">Letzte Notiz: Zahnreinigung aus Kalender erkannt</div></div></div></article><article class="card"><div class="row"><div class="icon">B</div><div><b>Blutbild</b><span>Noch kein Ergebnis hinterlegt · beim nächsten Check-up anfragen</span></div></div></article><article class="card"><b>Bereich hinzufügen</b><span>Kardiologie, Onkologie oder weitere Bereiche können später hier als eigene Erinnerung ergänzt werden.</span></article>`}function appointments(){content.innerHTML=`<article class="card"><div class="mini-calendar"><div class="cal-head"><span class="nav-btn">‹</span><span>September 2026</span><span class="nav-btn">›</span></div><div class="date-strip"><div class="date-pill"><span>Sep</span><b>21</b></div><div class="date-pill"><span>Sep</span><b>22</b></div><div class="date-pill"><span>Sep</span><b>23</b></div><div class="date-pill"><span>Sep</span><b>24</b></div></div></div></article><article class="card"><div class="row"><div class="icon doctolib-icon">${doctolibIcon}</div><div><b>Doctolib</b><span>Termine und Buchungen extern verwalten.</span><p><a class="link-action" href="https://www.doctolib.de/" target="_blank" rel="noopener">Öffnen</a></p></div></div></article><article class="card"><div class="row"><div class="icon">${toothIcon}</div><div><b>Zahnreinigung</b><span>29. Sep · 10:30 Uhr · Praxis am Park · aus Kalender erkannt</span><div class="details">Praxis am Park, Musterstraße 12<br>45 Minuten · Quelle: Kalender</div></div></div></article>`}function render(){renderTabs();if(view==="impfausweis")vaccines();else if(view==="termine")appointments();else areas()}importHash();render();})();
</script></body></html>
