      const dropdownCss = '.profile{position:relative}.avatar,.name,.flag{cursor:pointer}.profile-menu{position:absolute;left:10px;top:calc(100% + 8px);width:188px;display:none;gap:5px;background:#fffdf8;border:1px solid #ddd4c4;border-radius:16px;padding:7px;box-shadow:0 10px 26px rgba(32,36,31,.13);z-index:50}.profile-menu.open{display:grid}.profile-menu.align-right{left:auto;right:10px;min-width:0;width:max-content;grid-template-columns:42px}.menu-btn{border:1px solid #ddd4c4;background:#fffdf8;color:#20241f;border-radius:999px;padding:7px 10px;text-align:left;font-size:12px;font-weight:750}.profile-menu:not(.align-right) .menu-btn.active{background:#e7e3da;color:#20241f;border-color:#cfc6b6}.profile-menu.align-right .menu-btn{text-align:center;font-size:18px;line-height:1;padding:9px 0}.profile-menu.align-right .menu-btn.active{background:#e7e3da;color:#20241f;border-color:#cfc6b6}';
      const rule_css = '.due-header{display:grid;gap:3px}.due-kicker{color:#15574c;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.due-card .details{display:block}.rule-source{display:block;margin-top:6px;color:#8b8f86;font-size:11px}.why{margin-top:8px;border-top:1px solid #ece4d6;padding-top:8px}.why summary{cursor:pointer;color:#15574c;font-size:12px;font-weight:800}.why p{margin:6px 0 0}.due-status{display:inline-block;margin-top:4px;color:#15574c;font-size:12px;font-weight:850}.due-status.warn{color:#8a5a16}.due-list-note{margin:0;color:#697064;font-size:12px;line-height:1.4}';
      const dropdownScript = '<script>(function(){const PROFILE_KEY="health-profile-v1";const LANG_KEY="health-language-v1";const defaults=[{name:"Tuba Vogel",initials:"TV"},{name:"Caspar Vogel",initials:"CV"}];const langs={de:{flag:"🇩🇪",label:"Deutsch"},en:{flag:"🇬🇧",label:"English"},pt:{flag:"🇵🇹",label:"Português"},tr:{flag:"🇹🇷",label:"Türkçe"}};function readProfile(){try{return JSON.parse(localStorage.getItem(PROFILE_KEY))||{active:0,people:defaults}}catch(e){return{active:0,people:defaults}}}function saveProfile(p){localStorage.setItem(PROFILE_KEY,JSON.stringify(p))}function initials(name){return String(name||"").split(/\\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"TV"}function applyProfile(){const p=readProfile();const person=(p.people&&p.people[p.active])||defaults[0];const avatar=document.querySelector(".avatar");const name=document.querySelector(".name");if(avatar)avatar.textContent=person.initials||initials(person.name);if(name)name.textContent=person.name||"Tuba Vogel"}function applyLang(){const key=localStorage.getItem(LANG_KEY)||"de";const lang=langs[key]||langs.de;const flag=document.querySelector(".flag");if(flag)flag.textContent=lang.flag+"⌄";document.documentElement.lang=key}function closeMenus(){document.querySelectorAll(".profile-menu.open").forEach(x=>x.classList.remove("open"))}function buildMenus(){const profile=document.querySelector(".profile");if(!profile||document.getElementById("profileMenu"))return;const pm=document.createElement("div");pm.id="profileMenu";pm.className="profile-menu";const lm=document.createElement("div");lm.id="languageMenu";lm.className="profile-menu align-right";profile.append(pm,lm);renderProfileMenu();renderLanguageMenu();const avatar=document.querySelector(".avatar");const name=document.querySelector(".name");const flag=document.querySelector(".flag");[avatar,name].forEach(el=>el&&el.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();document.getElementById("languageMenu").classList.remove("open");pm.classList.toggle("open")}));flag&&flag.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();pm.classList.remove("open");lm.classList.toggle("open")});document.addEventListener("click",closeMenus)}function renderProfileMenu(){const menu=document.getElementById("profileMenu");if(!menu)return;const p=readProfile();menu.innerHTML="";(p.people||defaults).forEach((person,index)=>{const b=document.createElement("button");b.type="button";b.className="menu-btn"+(index===p.active?" active":"");b.textContent=person.name;b.onclick=()=>{p.active=index;saveProfile(p);applyProfile();renderProfileMenu();closeMenus()};menu.appendChild(b)});const edit=document.createElement("button");edit.type="button";edit.className="menu-btn";edit.textContent="Namen bearbeiten";edit.onclick=()=>{const p=readProfile();const current=(p.people&&p.people[p.active])||defaults[0];const next=prompt("Name",current.name||"");if(next&&next.trim()){current.name=next.trim();current.initials=initials(next);p.people[p.active]=current;saveProfile(p);applyProfile();renderProfileMenu()}};menu.appendChild(edit)}function renderLanguageMenu(){const menu=document.getElementById("languageMenu");if(!menu)return;const current=localStorage.getItem(LANG_KEY)||"de";menu.innerHTML="";Object.keys(langs).forEach(key=>{const b=document.createElement("button");b.type="button";b.className="menu-btn"+(key===current?" active":"");b.textContent=langs[key].flag;b.title=langs[key].label;b.setAttribute("aria-label",langs[key].label);b.onclick=()=>{localStorage.setItem(LANG_KEY,key);applyLang();renderLanguageMenu();closeMenus()};menu.appendChild(b)})}applyProfile();applyLang();buildMenus();})();<\/script>';
      const replacements = [
        ['Zuletzt: Zahnreinigung 29. Sept. 2026 · nächste Kontrolle in 6 Monaten planen', 'Letzte Zahnreinigung: Ende September 2026 · Erinnerung: nächsten Termin für März 2027 anfragen'],
        ['Letzte Notiz: Zahnreinigung aus Kalender erkannt', 'Nächster Schritt: Termin über Doctolib oder Kalender übernehmen, sobald die Integration verbunden ist.'],
        ['<span>September 2026</span><span class="nav-btn">›</span></div><div class="date-strip"><div class="date-pill"><span>Sep</span><b>21</b></div><div class="date-pill"><span>Sep</span><b>22</b></div><div class="date-pill"><span>Sep</span><b>23</b></div><div class="date-pill"><span>Sep</span><b>24</b></div>', '<span>März 2027</span><span class="nav-btn">›</span></div><div class="date-strip"><div class="date-pill"><span>Mär</span><b>23</b></div><div class="date-pill"><span>Mär</span><b>24</b></div><div class="date-pill"><span>Mär</span><b>25</b></div><div class="date-pill"><span>Mär</span><b>26</b></div>'],

"B",title:"Check-up / Blutbild",status:"Status offen",text:"Letzten Check-up oder letzte Laborwerte hinterlegen, damit die App die nächste Erinnerung berechnen kann.",source:"Standard: 18-34 einmalig; ab 35 alle 3 Jahre als GKV-Leistung möglich.",why:"Blutbild wird nicht pauschal als eigener Pflichttermin gesetzt. Es wird als Teil des Check-ups oder als individuell hinterlegter Bereich geführt.",tone:"warn"},    {icon:"G",title:"Gynäkologische Krebsfrüherkennung",status:"Letzten Termin hinterlegen",text:"Sobald der letzte Termin eingetragen ist, kann die App das passende Intervall nach Alter und Untersuchung anzeigen.",source:"Quelle: G-BA Früherkennungsuntersuchungen und Krebsfrüherkennungs-Richtlinie.",why:"Die Intervalle unterscheiden sich je nach Alter. Deshalb braucht die App hier den letzten dokumentierten Termin, statt blind ein Datum zu behaupten.",tone:"warn"}  ];  content.innerHTML=\'<article class="card"><div class="due-header"><span class="due-kicker">Regelbasiert</span><b>Fällig und zu prüfen</b><p class="due-list-note">Diese Liste wird aus Vorsorge- und Impfregeln erzeugt. Standards sind vorgeschlagen und später individuell änderbar.</p></div></article>\'+items.map(item=>`<article class="card due-card"><div class="row"><div class="icon">${item.icon}</div><div><b>${item.title}</b><span>${item.text}</span><span class="due-status ${item.tone===\'warn\'?\'warn\':\'\'}">${item.status}</span><span class="rule-source">${item.source}</span><details class="why"><summary>Warum?</summary><p>${item.why}</p></details></div></div></article>`).join(\'\');})();<\/script>' + '</body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.querySelector('main').innerHTML = '<h1>Aktualisierung fehlgeschlagen</h1><p>Bitte die Seite einmal neu laden.</p>';
      }
    })();
  </script>
