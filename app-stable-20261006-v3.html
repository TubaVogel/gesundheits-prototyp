<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Gesundheits-Timeline</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f1ea; color: #20241f; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { max-width: 380px; background: #faf7ef; border: 1px solid #d8cfbf; border-radius: 24px; padding: 22px; }
  </style>
</head>
<body>
  <main>
    <h1>Gesundheits-Timeline wird aktualisiert</h1>
    <p>Die aktuelle Ansicht wird geladen.</p>
  </main>
  <script>
    (async function () {
      const appVersion = 'profile-language-flags-soft-20261007';
      const incoming = new URLSearchParams(location.search);
      try {
        const versionInfo = await fetch('version.json?ts=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
        if (versionInfo && versionInfo.current && versionInfo.current !== appVersion && incoming.get('v') !== versionInfo.current) {
          const target = new URL('app-stable-20261006-v3.html', location.href);
          const view = incoming.get('view') || incoming.get('tab') || '';
          if (view) target.searchParams.set('view', view);
          target.searchParams.set('v', versionInfo.current);
          target.searchParams.set('from', incoming.get('from') || 'version-check');
          location.replace(target.href);
          return;
        }
      } catch (e) {}
      const stableSource = 'https://raw.githubusercontent.com/TubaVogel/gesundheits-prototyp/0ec69b57f76f7fc81f945f43ff9c069639e78d5e/app-stable-20261006-v3.html';
      const dropdownCss = '.profile{position:relative}.avatar,.name,.flag{cursor:pointer}.profile-menu{position:absolute;left:10px;right:10px;top:calc(100% + 8px);display:none;gap:7px;background:#fffdf8;border:1px solid #ddd4c4;border-radius:18px;padding:10px;box-shadow:0 14px 35px rgba(32,36,31,.16);z-index:50}.profile-menu.open{display:grid}.profile-menu.align-right{left:auto;right:10px;min-width:0;width:max-content;grid-template-columns:42px}.menu-btn{border:1px solid #ddd4c4;background:#fffdf8;color:#20241f;border-radius:999px;padding:9px 11px;text-align:left;font-size:12px;font-weight:800}.profile-menu.align-right .menu-btn{text-align:center;font-size:18px;line-height:1;padding:9px 0}.menu-btn.active{background:#20241f;color:#fff;border-color:#20241f}.profile-menu.align-right .menu-btn.active{background:#e7e3da;color:#20241f;border-color:#cfc6b6}.menu-note{font-size:11px;color:#697064;line-height:1.35;padding:0 2px}';
      const dropdownScript = '<script>(function(){const PROFILE_KEY="health-profile-v1";const LANG_KEY="health-language-v1";const defaults=[{name:"Tuba Vogel",initials:"TV"},{name:"Caspar Vogel",initials:"CV"}];const langs={de:{flag:"🇩🇪",label:"Deutsch"},en:{flag:"🇬🇧",label:"English"},pt:{flag:"🇵🇹",label:"Português"},tr:{flag:"🇹🇷",label:"Türkçe"}};function readProfile(){try{return JSON.parse(localStorage.getItem(PROFILE_KEY))||{active:0,people:defaults}}catch(e){return{active:0,people:defaults}}}function saveProfile(p){localStorage.setItem(PROFILE_KEY,JSON.stringify(p))}function initials(name){return String(name||"").split(/\\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"TV"}function applyProfile(){const p=readProfile();const person=(p.people&&p.people[p.active])||defaults[0];const avatar=document.querySelector(".avatar");const name=document.querySelector(".name");if(avatar)avatar.textContent=person.initials||initials(person.name);if(name)name.textContent=person.name||"Tuba Vogel"}function applyLang(){const key=localStorage.getItem(LANG_KEY)||"de";const lang=langs[key]||langs.de;const flag=document.querySelector(".flag");if(flag)flag.textContent=lang.flag+"⌄";document.documentElement.lang=key}function closeMenus(){document.querySelectorAll(".profile-menu.open").forEach(x=>x.classList.remove("open"))}function buildMenus(){const profile=document.querySelector(".profile");if(!profile||document.getElementById("profileMenu"))return;const pm=document.createElement("div");pm.id="profileMenu";pm.className="profile-menu";const lm=document.createElement("div");lm.id="languageMenu";lm.className="profile-menu align-right";profile.append(pm,lm);renderProfileMenu();renderLanguageMenu();const avatar=document.querySelector(".avatar");const name=document.querySelector(".name");const flag=document.querySelector(".flag");[avatar,name].forEach(el=>el&&el.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();document.getElementById("languageMenu").classList.remove("open");pm.classList.toggle("open")}));flag&&flag.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();pm.classList.remove("open");lm.classList.toggle("open")});document.addEventListener("click",closeMenus)}function renderProfileMenu(){const menu=document.getElementById("profileMenu");if(!menu)return;const p=readProfile();menu.innerHTML="";(p.people||defaults).forEach((person,index)=>{const b=document.createElement("button");b.type="button";b.className="menu-btn"+(index===p.active?" active":"");b.textContent=(person.initials||initials(person.name))+" · "+person.name;b.onclick=()=>{p.active=index;saveProfile(p);applyProfile();renderProfileMenu();closeMenus()};menu.appendChild(b)});const edit=document.createElement("button");edit.type="button";edit.className="menu-btn";edit.textContent="Namen bearbeiten";edit.onclick=()=>{const p=readProfile();const current=(p.people&&p.people[p.active])||defaults[0];const next=prompt("Name",current.name||"");if(next&&next.trim()){current.name=next.trim();current.initials=initials(next);p.people[p.active]=current;saveProfile(p);applyProfile();renderProfileMenu()}};menu.appendChild(edit);const note=document.createElement("div");note.className="menu-note";note.textContent="Hier wechselst du später auch Familienmitglieder.";menu.appendChild(note)}function renderLanguageMenu(){const menu=document.getElementById("languageMenu");if(!menu)return;const current=localStorage.getItem(LANG_KEY)||"de";menu.innerHTML="";Object.keys(langs).forEach(key=>{const b=document.createElement("button");b.type="button";b.className="menu-btn"+(key===current?" active":"");b.textContent=langs[key].flag;b.title=langs[key].label;b.setAttribute("aria-label",langs[key].label);b.onclick=()=>{localStorage.setItem(LANG_KEY,key);applyLang();renderLanguageMenu();closeMenus()};menu.appendChild(b)})}applyProfile();applyLang();buildMenus();})();<\/script>';
      const replacements = [
        ['Zuletzt: Zahnreinigung 29. Sept. 2026 · nächste Kontrolle in 6 Monaten planen', 'Letzte Zahnreinigung: Ende September 2026 · Erinnerung: nächsten Termin für März 2027 anfragen'],
        ['Letzte Notiz: Zahnreinigung aus Kalender erkannt', 'Nächster Schritt: Termin über Doctolib oder Kalender übernehmen, sobald die Integration verbunden ist.'],
        ['<span>September 2026</span><span class="nav-btn">›</span></div><div class="date-strip"><div class="date-pill"><span>Sep</span><b>21</b></div><div class="date-pill"><span>Sep</span><b>22</b></div><div class="date-pill"><span>Sep</span><b>23</b></div><div class="date-pill"><span>Sep</span><b>24</b></div>', '<span>März 2027</span><span class="nav-btn">›</span></div><div class="date-strip"><div class="date-pill"><span>Mär</span><b>23</b></div><div class="date-pill"><span>Mär</span><b>24</b></div><div class="date-pill"><span>Mär</span><b>25</b></div><div class="date-pill"><span>Mär</span><b>26</b></div>'],
        ['<b>Zahnreinigung</b><span>29. Sep · 10:30 Uhr · Praxis am Park · aus Kalender erkannt</span><div class="details">Praxis am Park, Musterstraße 12<br>45 Minuten · Quelle: Kalender</div>', '<b>Zahnreinigung planen</b><span>März 2027 · Erinnerung: nächsten Termin anfragen</span><div class="details">Letzte Zahnreinigung: Ende September 2026<br>Nächster Schritt: Termin über Doctolib öffnen oder aus Kalender übernehmen.</div>']
      ];
      try {
        let html = await fetch(stableSource + '?v=profile-language-flags-soft-20261007', { cache: 'no-store' }).then(r => r.text());
        replacements.forEach(([oldText, newText]) => { html = html.replace(oldText, newText); });
        html = html.replace('</head>', '<style id="profile-menu-style">' + dropdownCss + '</style></head>');
        html = html.replace('</body>', dropdownScript + '</body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.querySelector('main').innerHTML = '<h1>Aktualisierung fehlgeschlagen</h1><p>Bitte die Seite einmal neu laden.</p>';
      }
    })();
  </script>
</body>
</html>
