<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Gesundheits-Timeline</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f1ea; color: #20241f; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { max-width: 380px; background: #faf7ef; border: 1px solid #d8cfbf; border-radius: 24px; padding: 22px; }
  </style>
</head>
<body>
  <main>
    <h1>Gesundheits-Timeline wird aktualisiert</h1>
    <p>Die aktuelle Ansicht wird geladen.</p>
  </main>
  <script>
    (async function () {
      const stableSource = 'https://raw.githubusercontent.com/TubaVogel/gesundheits-prototyp/0ec69b57f76f7fc81f945f43ff9c069639e78d5e/app-stable-20261006-v3.html';
      const replacements = [
        [
          'Zuletzt: Zahnreinigung 29. Sept. 2026 · nächste Kontrolle in 6 Monaten planen',
          'Letzte Zahnreinigung: Ende September 2026 · Erinnerung: nächsten Termin für März 2027 anfragen'
        ],
        [
          'Letzte Notiz: Zahnreinigung aus Kalender erkannt',
          'Nächster Schritt: Termin über Doctolib oder Kalender übernehmen, sobald die Integration verbunden ist.'
        ],
        [
          '<span>September 2026</span><span class="nav-btn">›</span></div><div class="date-strip"><div class="date-pill"><span>Sep</span><b>21</b></div><div class="date-pill"><span>Sep</span><b>22</b></div><div class="date-pill"><span>Sep</span><b>23</b></div><div class="date-pill"><span>Sep</span><b>24</b></div>',
          '<span>März 2027</span><span class="nav-btn">›</span></div><div class="date-strip"><div class="date-pill"><span>Mär</span><b>23</b></div><div class="date-pill"><span>Mär</span><b>24</b></div><div class="date-pill"><span>Mär</span><b>25</b></div><div class="date-pill"><span>Mär</span><b>26</b></div>'
        ],
        [
          '<b>Zahnreinigung</b><span>29. Sep · 10:30 Uhr · Praxis am Park · aus Kalender erkannt</span><div class="details">Praxis am Park, Musterstraße 12<br>45 Minuten · Quelle: Kalender</div>',
          '<b>Zahnreinigung planen</b><span>März 2027 · Erinnerung: nächsten Termin anfragen</span><div class="details">Letzte Zahnreinigung: Ende September 2026<br>Nächster Schritt: Termin über Doctolib öffnen oder aus Kalender übernehmen.</div>'
        ]
      ];
      try {
        let html = await fetch(stableSource + '?v=dental-reminder-20261007', { cache: 'no-store' }).then(r => r.text());
        replacements.forEach(([oldText, newText]) => { html = html.replace(oldText, newText); });
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.querySelector('main').innerHTML = '<h1>Aktualisierung fehlgeschlagen</h1><p>Bitte die Seite einmal neu laden.</p>';
      }
    })();
  </script>
</body>
</html>
