<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="build" content="doctolib-links-2026-09-21" />
  <title>Gesundheits-Timeline</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f1ea;color:#20241f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(420px,100%);min-height:min(850px,calc(100vh - 36px));background:#faf7ef;border:1px solid #d8cfbf;border-radius:30px;padding:18px;box-shadow:0 22px 70px rgba(32,36,31,.16)}.profile{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#fffdf8;border:1px solid #ddd4c4;border-radius:20px;padding:12px;margin-bottom:18px}button{font:inherit}.avatar{width:38px;height:38px;border:0;border-radius:999px;background:#277465;color:white;font-size:13px;font-weight:800}.label{display:block;color:#697064;font-size:11px;margin-bottom:2px}.name{font-size:16px;font-weight:800}.flag{border:0;background:transparent;font-size:18px}.menu{position:absolute;top:58px;left:12px;right:12px;z-index:2;display:none;gap:4px;padding:8px;background:#fffdf8;border:1px solid #ddd4c4;border-radius:16px;box-shadow:0 16px 34px rgba(32,36,31,.16)}.menu.open{display:grid}.menu button{border:0;border-radius:11px;background:transparent;padding:10px;text-align:left;color:#20241f}.menu button.active{background:#eee8dc}h1{margin:0 0 6px;font-size:25px;line-height:1.08}.sub{margin:0 0 18px;color:#697064;font-size:13px;line-height:1.4}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:15px}.tab{border:1px solid #ddd4c4;background:#fffdf8;color:#20241f;border-radius:999px;padding:9px 4px;font-size:13px;font-weight:800}.tab.active{background:#20241f;border-color:#20241f;color:#f9f6ee}.stack{display:grid;gap:10px}.card{background:#fffdf8;border:1px solid #ddd4c4;border-radius:20px;padding:14px}.card.primary{border:2px solid #277465;background:#f6fffb}.row{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start}.icon{display:grid;place-items:center;min-height:50px;border-radius:15px;background:#e5f2ed;color:#15574c;font-size:13px;font-weight:800;text-align:center}b{display:block;margin-bottom:4px;font-size:15px}span,p{color:#697064;font-size:12px;line-height:1.4}.mini-calendar{display:grid;grid-template-columns:28px 1fr 28px;gap:6px;align-items:center;margin-bottom:10px}.nav-btn{width:28px;height:28px;border:1px solid #ddd4c4;background:#fffdf8;border-radius:999px;color:#20241f;font-size:17px;line-height:1}.date-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.date-pill{border:1px solid #ddd4c4;background:#fffdf8;border-radius:12px;padding:5px 2px;text-align:center}.date-pill b{margin:0;font-size:12px}.date-pill span{display:block;font-size:10px}.date-pill.hit{background:#e5f2ed;border-color:#94c8b8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.action{border:1px solid #277465;border-radius:999px;padding:9px 8px;text-align:center;color:#15574c;font-size:12px;font-weight:800;text-decoration:none}.action.main{background:#277465;color:#fff}.empty{color:#697064;text-align:center;padding:22px}
  </style>
</head>
<body>
  <main class="app">
    <section class="profile">
      <button class="avatar" type="button" id="profileButton" aria-label="Profil wechseln">TV</button>
      <div><span class="label">Profil</span><span class="name" id="profileName">Tuba Vogel</span></div>
      <button class="flag" type="button" id="languageButton" aria-label="Sprache wechseln">🇩🇪⌄</button>
      <div class="menu" id="profileMenu"></div><div class="menu" id="languageMenu"></div>
    </section>
    <h1>Gesundheits-Timeline</h1>
    <p class="sub">Vorsorge, Impfausweis und Termine an einem Ort.</p>
    <nav class="tabs" aria-label="Ansicht">
      <button class="tab" data-view="alle">Alle</button><button class="tab" data-view="faellig">Fällig</button><button class="tab" data-view="impfausweis">Impfausweis</button><button class="tab active" data-view="termine">Termine</button>
    </nav>
    <section class="stack" id="content" aria-live="polite"></section>
  </main>
  <script>
    const fallbackData={profiles:[{id:"tuba",name:"Tuba Vogel",initials:"TV"},{id:"caspar",name:"Caspar Vogel",initials:"CV"}],languages:[{code:"de",label:"Deutsch",flag:"🇩🇪"}],careItems:[],vaccinations:[],appointments:[]};
    let data=fallbackData,activeProfile="tuba",activeLanguage="de",activeView="termine";
    const $=id=>document.getElementById(id),content=$("content"),profileButton=$("profileButton"),profileName=$("profileName"),profileMenu=$("profileMenu"),languageButton=$("languageButton"),languageMenu=$("languageMenu"),tabs=[...document.querySelectorAll(".tab")];
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    function itemCard(item){return `<article class="card"><div class="row"><div class="icon">${esc(item.initial||item.date||"")}</div><div><b>${esc(item.title||item.name)}</b><span>${esc(item.last?`Zuletzt: ${item.last} · ${item.next}`:item.details||item.note||"")}</span></div></div></article>`}
    function renderProfile(){const p=data.profiles.find(x=>x.id===activeProfile)||data.profiles[0],l=data.languages.find(x=>x.code===activeLanguage)||data.languages[0];profileButton.textContent=p.initials;profileName.textContent=p.name;languageButton.textContent=`${l.flag}⌄`;profileMenu.innerHTML=data.profiles.map(x=>`<button class="${x.id===activeProfile?"active":""}" data-profile="${x.id}">${x.initials} · ${esc(x.name)}</button>`).join("")+`<button>+ Person hinzufügen</button>`;languageMenu.innerHTML=data.languages.map(x=>`<button class="${x.code===activeLanguage?"active":""}" data-language="${x.code}">${x.flag} ${esc(x.label)}</button>`).join("")}
    function renderContent(){tabs.forEach(t=>t.classList.toggle("active",t.dataset.view===activeView));if(activeView==="alle")content.innerHTML=data.careItems.map(itemCard).join("")||`<p class="empty">Noch keine Einträge.</p>`;if(activeView==="faellig"){const due=data.careItems.filter(x=>["fällig","bald","prüfen"].includes(x.status));content.innerHTML=due.map(itemCard).join("")||`<p class="empty">Aktuell nichts fällig.</p>`}if(activeView==="impfausweis")content.innerHTML=`<article class="card primary"><div class="row"><div class="icon">I</div><div><b>Impfausweis</b><span>Gelben Impfpass fotografieren, Impfungen erkennen, Auffrischungen prüfen</span></div></div></article>${data.vaccinations.map(x=>`<article class="card"><b>${esc(x.name)}</b><span>${esc(x.date)} · ${esc(x.note)}</span></article>`).join("")}`;if(activeView==="termine"){const days=data.appointments.map(x=>x.date.split(" ")[0]);content.innerHTML=`<article class="card"><div class="mini-calendar"><button class="nav-btn" aria-label="Vorherige Woche">‹</button><div class="date-strip">${["21","22","23","29"].map(d=>`<div class="date-pill ${days.includes(d)?"hit":""}"><span>Sep</span><b>${d}</b></div>`).join("")}</div><button class="nav-btn" aria-label="Nächste Woche">›</button></div></article>${data.appointments.map(x=>`<article class="card ${x.primary?"primary":""}"><div class="row"><div class="icon">${esc(x.date)}</div><div><b>${esc(x.title)}</b><span>${esc(x.details)}</span>${x.primary?`<div class="actions"><a class="action main" href="${esc(x.url||"https://www.doctolib.de/")}" target="_blank" rel="noopener">Termin anfragen</a><a class="action" href="${esc(x.url||"https://www.doctolib.de/")}" target="_blank" rel="noopener">Plattform öffnen</a></div>`:""}</div></div></article>`).join("")}`}}
    function render(){renderProfile();renderContent()}profileButton.onclick=()=>{languageMenu.classList.remove("open");profileMenu.classList.toggle("open")};languageButton.onclick=()=>{profileMenu.classList.remove("open");languageMenu.classList.toggle("open")};profileMenu.onclick=e=>{if(!e.target.dataset.profile)return;activeProfile=e.target.dataset.profile;profileMenu.classList.remove("open");render()};languageMenu.onclick=e=>{if(!e.target.dataset.language)return;activeLanguage=e.target.dataset.language;languageMenu.classList.remove("open");render()};tabs.forEach(t=>t.onclick=()=>{activeView=t.dataset.view;render()});fetch("./data.json?v=doctolib-links-2026-09-21").then(r=>r.ok?r.json():fallbackData).then(j=>{data=j;render()}).catch(()=>render());
  </script>
</body>
</html>
