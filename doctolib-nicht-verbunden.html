  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f1ea;color:#20241f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(420px,100%);min-height:min(850px,calc(100vh - 36px));background:#faf7ef;border:1px solid #d8cfbf;border-radius:30px;padding:18px;box-shadow:0 22px 70px rgba(32,36,31,.16)}button{font:inherit}.profile{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#fffdf8;border:1px solid #ddd4c4;border-radius:20px;padding:12px;margin-bottom:18px}.avatar{width:38px;height:38px;border:0;border-radius:999px;background:#277465;color:white;font-size:13px;font-weight:800}.label{display:block;color:#697064;font-size:11px;margin-bottom:2px}.name{font-size:16px;font-weight:800}.flag{border:0;background:transparent;font-size:18px}.menu{position:absolute;top:58px;left:12px;right:12px;z-index:3;display:none;gap:4px;padding:8px;background:#fffdf8;border:1px solid #ddd4c4;border-radius:16px;box-shadow:0 16px 34px rgba(32,36,31,.16)}.menu.open{display:grid}.menu button{border:0;border-radius:11px;background:transparent;padding:10px;text-align:left;color:#20241f}.menu button.active{background:#eee8dc}h1{margin:0 0 6px;font-size:25px;line-height:1.08}.sub{margin:0 0 18px;color:#697064;font-size:13px;line-height:1.4}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:15px}.tab{border:1px solid #ddd4c4;background:#fffdf8;color:#20241f;border-radius:999px;padding:9px 4px;font-size:13px;font-weight:800}.tab.active{background:#20241f;border-color:#20241f;color:#f9f6ee}.stack{display:grid;gap:10px}.card{background:#fffdf8;border:1px solid #ddd4c4;border-radius:20px;padding:14px}.card.setup,.card.primary{border:2px solid #277465;background:#f6fffb}.row{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start}.icon,.source-icon{width:56px;min-height:50px;border-radius:15px;display:grid;place-items:center;background:#e5f2ed;color:#15574c;font-size:13px;font-weight:800;text-align:center}.doctolib-mark{background:#e5f2ed}.doctolib-app-icon{width:34px;height:34px;border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(32,36,31,.2);background:linear-gradient(180deg,#16a8ef,#047cd8);position:relative}.doctolib-app-icon::before{content:"D";position:absolute;inset:0;display:grid;place-items:center;color:white;font-size:27px;font-style:italic;font-family:"Bradley Hand","Snell Roundhand",cursive;font-weight:700;transform:rotate(-7deg)}.calendar-icon{background:#eee8dc;color:#5e5548}.line-icon svg,.calendar-icon svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.tooth-icon{background:#eef4f2;color:#15574c}b{display:block;margin-bottom:4px;font-size:15px}span,p{color:#697064;font-size:12px;line-height:1.4}.mini-calendar{display:grid;grid-template-columns:28px 1fr 28px;gap:6px;align-items:center}.nav-btn{width:28px;height:28px;border:1px solid #ddd4c4;background:#fffdf8;border-radius:999px;color:#20241f;font-size:17px;line-height:1;cursor:pointer}.date-wrap{display:grid;gap:5px}.date-year{text-align:center;color:#697064;font-size:11px;font-weight:800}.date-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.date-pill{border:1px solid #ddd4c4;background:#fffdf8;border-radius:12px;padding:5px 2px;text-align:center}.date-pill b{margin:0;font-size:12px}.date-pill span{display:block;font-size:10px}.date-pill.hit{background:#e5f2ed;border-color:#94c8b8}.actions{display:grid;gap:8px;margin-top:10px}.action{border:1px solid #277465;border-radius:999px;padding:9px 8px;text-align:center;color:#15574c;font-size:12px;font-weight:800;background:transparent}.action.main{background:#277465;color:white}.action.secondary-action{border-color:#b9ad99;color:#5e5548}.hint{margin-top:9px;color:#697064;font-size:11px;line-height:1.35}.empty{color:#697064;text-align:center;padding:22px}
  </style>
</head>
<body>
  <main class="app">
    <section class="profile">
      <button class="avatar" type="button" id="profileButton" aria-label="Profil wechseln">TV</button>
      <div><span class="label">Profil</span><span class="name" id="profileName">Tuba Vogel</span></div>
      <button class="flag" type="button" id="languageButton" aria-label="Sprache wechseln">🇩🇪⌄</button>
      <div class="menu" id="profileMenu"></div><div class="menu" id="languageMenu"></div>
    </section>
    <h1>Gesundheits-Timeline</h1>
    <p class="sub">Vorsorge, Impfausweis und Termine an einem Ort.</p>
    <nav class="tabs" aria-label="Ansicht">
      <button class="tab" data-view="alle">Alle</button><button class="tab" data-view="faellig">Fällig</button><button class="tab" data-view="impfausweis">Impfausweis</button><button class="tab active" data-view="termine">Termine</button>
    </nav>
    <section class="stack" id="content" aria-live="polite"></section>
  </main>
  <script>
    const data={profiles:[{id:"tuba",name:"Tuba Vogel",initials:"TV"},{id:"caspar",name:"Caspar Vogel",initials:"CV"}],languages:[{code:"de",label:"Deutsch",flag:"🇩🇪"},{code:"en",label:"English",flag:"🇬🇧"},{code:"pt",label:"Português",flag:"🇵🇹"},{code:"tr",label:"Türkçe",flag:"🇹🇷"}],careItems:[{title:"Zahnreinigung",initial:"Z",last:"12. Februar 2026",next:"seit August 2026 fällig",status:"fällig"},{title:"Gynäkologische Untersuchung",initial:"G",last:"4. November 2025",next:"November 2026",status:"bald"},{title:"Krebsvorsorge",initial:"K",last:"Hautscreening 22. März 2025",next:"Darmkrebsvorsorge prüfen",status:"prüfen"},{title:"Impfausweis",initial:"I",last:"Tetanus 9. Juni 2023",next:"Auffrischungen im Blick",status:"aktuell"}],vaccinations:[{name:"Tetanus",date:"09.06.2023",note:"2033 prüfen"},{name:"COVID-19",date:"18.09.2021",note:"nach Bedarf"},{name:"FSME",date:"14.07.2019",note:"Auffrischung prüfen"}]};
    let activeProfile="tuba",activeLanguage="de",activeView="termine",startDate=new Date(2026,8,21);
    const monthNames=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"],$=id=>document.getElementById(id),content=$("content"),profileButton=$("profileButton"),profileName=$("profileName"),profileMenu=$("profileMenu"),languageButton=$("languageButton"),languageMenu=$("languageMenu"),tabs=[...document.querySelectorAll(".tab")];
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    function itemCard(item){return `<article class="card"><div class="row"><div class="icon">${esc(item.initial||"")}</div><div><b>${esc(item.title||item.name)}</b><span>${esc(item.last?`Zuletzt: ${item.last} · ${item.next}`:item.details||item.note||"")}</span></div></div></article>`}
    function calendarCard(){const days=Array.from({length:4},(_,i)=>{const date=new Date(startDate);date.setDate(startDate.getDate()+i);return date});const yearText=days[0].getFullYear()===days[3].getFullYear()?days[0].getFullYear():`${days[0].getFullYear()} / ${days[3].getFullYear()}`;return `<article class="card"><div class="mini-calendar"><button class="nav-btn" id="prevDays" aria-label="Vorherige Tage">‹</button><div class="date-wrap"><div class="date-year">${yearText}</div><div class="date-strip">${days.map(date=>`<div class="date-pill"><span>${monthNames[date.getMonth()]}</span><b>${date.getDate()}</b></div>`).join("")}</div></div><button class="nav-btn" id="nextDays" aria-label="Nächste Tage">›</button></div></article>`}
    function renderProfile(){const p=data.profiles.find(x=>x.id===activeProfile),l=data.languages.find(x=>x.code===activeLanguage);profileButton.textContent=p.initials;profileName.textContent=p.name;languageButton.textContent=`${l.flag}⌄`;profileMenu.innerHTML=data.profiles.map(x=>`<button class="${x.id===activeProfile?"active":""}" data-profile="${x.id}">${x.initials} · ${esc(x.name)}</button>`).join("")+`<button>+ Person hinzufügen</button>`;languageMenu.innerHTML=data.languages.map(x=>`<button class="${x.code===activeLanguage?"active":""}" data-language="${x.code}">${x.flag} ${esc(x.label)}</button>`).join("")}
    function renderContent(){tabs.forEach(t=>t.classList.toggle("active",t.dataset.view===activeView));if(activeView==="alle")content.innerHTML=data.careItems.map(itemCard).join("");if(activeView==="faellig")content.innerHTML=data.careItems.filter(x=>["fällig","bald","prüfen"].includes(x.status)).map(itemCard).join("")||`<p class="empty">Aktuell nichts fällig.</p>`;if(activeView==="impfausweis")content.innerHTML=`<article class="card primary"><div class="row"><div class="icon">I</div><div><b>Impfausweis</b><span>Gelben Impfpass fotografieren, Impfungen erkennen, Auffrischungen prüfen</span></div></div></article>${data.vaccinations.map(x=>`<article class="card"><b>${esc(x.name)}</b><span>${esc(x.date)} · ${esc(x.note)}</span></article>`).join("")}`;if(activeView==="termine"){content.innerHTML=`${calendarCard()}<article class="card setup"><div class="row"><div class="source-icon doctolib-mark" aria-label="Doctolib"><div class="doctolib-app-icon" aria-hidden="true"></div></div><div><b>Doctolib-Termine verbinden</b><span>Vorhandene Termine direkt aus Doctolib in deine Gesundheits-Timeline übernehmen.</span><div class="actions"><button class="action main">Doctolib-Termine verbinden</button></div><div class="hint">Nach der Verbindung wird daraus eine kleine Aktion in der Doctolib-Karte.</div></div></div></article><article class="card"><div class="row"><div class="source-icon calendar-icon" aria-label="Kalender"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg></div><div><b>Weitere Termine übernehmen</b><span>Termine aus deinem Handy-Kalender importieren, wenn sie dort bereits gespeichert sind.</span><div class="actions"><button class="action secondary-action">Aus Kalender importieren</button></div></div></div></article><article class="card"><div class="row"><div class="icon line-icon tooth-icon" aria-label="Zahnreinigung"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3.5c1.2 0 2.1.7 3.5.7s2.3-.7 3.5-.7c2 0 3.5 1.7 3.5 4 0 2.1-1.1 4-1.7 5.7-.6 1.8-.7 4.8-2 6.1-.8.8-1.8.2-2-1.1-.4-2.4-.7-4.1-1.8-4.1s-1.4 1.7-1.8 4.1c-.2 1.3-1.2 1.9-2 1.1-1.3-1.3-1.4-4.3-2-6.1C4.6 11.5 3.5 9.6 3.5 7.5c0-2.3 1.5-4 3.5-4z"></path></svg></div><div><b>Zahnreinigung</b><span>29 Sep · 10:30 Uhr · Praxis am Park · aus Kalender erkannt</span></div></div></article>`;$("prevDays").onclick=()=>{startDate.setDate(startDate.getDate()-4);renderContent()};$("nextDays").onclick=()=>{startDate.setDate(startDate.getDate()+4);renderContent()}}}
    function render(){renderProfile();renderContent()}profileButton.onclick=()=>{languageMenu.classList.remove("open");profileMenu.classList.toggle("open")};languageButton.onclick=()=>{profileMenu.classList.remove("open");languageMenu.classList.toggle("open")};profileMenu.onclick=e=>{if(!e.target.dataset.profile)return;activeProfile=e.target.dataset.profile;profileMenu.classList.remove("open");render()};languageMenu.onclick=e=>{if(!e.target.dataset.language)return;activeLanguage=e.target.dataset.language;languageMenu.classList.remove("open");render()};tabs.forEach(t=>t.onclick=()=>{activeView=t.dataset.view;render()});render();
  </script>
