  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f1ea;color:#20241f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(420px,100%);min-height:min(850px,calc(100vh - 36px));background:#faf7ef;border:1px solid #d8cfbf;border-radius:30px;padding:18px;box-shadow:0 22px 70px rgba(32,36,31,.16)}.profile{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#fffdf8;border:1px solid #ddd4c4;border-radius:20px;padding:12px;margin-bottom:18px}button,input{font:inherit}.avatar{width:38px;height:38px;border:0;border-radius:999px;background:#277465;color:white;font-size:13px;font-weight:800}.label{display:block;color:#697064;font-size:11px;margin-bottom:2px}.name{font-size:16px;font-weight:800}.flag{border:0;background:transparent;font-size:18px}.menu{position:absolute;top:58px;left:12px;right:12px;z-index:2;display:none;gap:4px;padding:8px;background:#fffdf8;border:1px solid #ddd4c4;border-radius:16px;box-shadow:0 16px 34px rgba(32,36,31,.16)}.menu.open{display:grid}.menu button{border:0;border-radius:11px;background:transparent;padding:10px;text-align:left;color:#20241f}.menu button.active{background:#eee8dc}h1{margin:0 0 6px;font-size:25px;line-height:1.08}.sub{margin:0 0 18px;color:#697064;font-size:13px;line-height:1.4}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:15px}.tab{border:1px solid #ddd4c4;background:#fffdf8;color:#20241f;border-radius:999px;padding:9px 4px;font-size:13px;font-weight:800}.tab.active{background:#20241f;border-color:#20241f;color:#f9f6ee}.stack{display:grid;gap:10px}.card{background:#fffdf8;border:1px solid #ddd4c4;border-radius:20px;padding:14px}.row{display:grid;grid-template-columns:50px 1fr;gap:12px;align-items:start}.icon{display:grid;place-items:center;width:50px;min-height:50px;border-radius:15px;background:#e5f2ed;color:#15574c;font-size:13px;font-weight:800;text-align:center}.icon svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.doc-icon{width:34px;height:34px;border-radius:9px;object-fit:cover}.doc-fallback{display:none;width:34px;height:34px;border-radius:9px;background:#1194df;color:white;font-weight:800;place-items:center}b{display:block;margin-bottom:4px;font-size:15px}span,p{color:#697064;font-size:12px;line-height:1.4}.mini-calendar{display:grid;gap:8px}.cal-head{display:flex;align-items:center;justify-content:space-between;color:#697064;font-size:12px;font-weight:800}.nav-btn{width:30px;height:30px;border:1px solid #ddd4c4;background:#fffdf8;border-radius:999px;color:#20241f;font-size:18px;line-height:1}.date-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.date-pill{border:1px solid #ddd4c4;background:#fffdf8;border-radius:12px;padding:6px 2px;text-align:center}.date-pill b{margin:0;font-size:13px}.date-pill span{display:block;font-size:10px}.date-pill.hit{background:#e5f2ed;border-color:#94c8b8}.integration{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:12px}.integration-actions{display:flex;gap:12px;margin-top:4px}.link-action{border:0;background:transparent;color:#15574c;font-size:12px;font-weight:800;padding:0;text-decoration:underline;text-underline-offset:3px}.appointment{cursor:pointer}.details{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #ece4d6;color:#697064;font-size:12px;line-height:1.45}.appointment.open .details{display:block}.empty{color:#697064;text-align:center;padding:22px}.privacy{background:#eef4f2;border-color:#cbded8}.form{display:grid;gap:8px}.field{width:100%;border:1px solid #ddd4c4;border-radius:12px;background:#fffdf8;padding:10px;color:#20241f}.field::placeholder{color:#8b8f86}.single-actions{display:grid;gap:8px;margin-top:8px}.action{border:1px solid #277465;border-radius:999px;padding:9px 8px;text-align:center;color:#15574c;font-size:12px;font-weight:800;text-decoration:none;background:transparent}.action.main{background:#277465;color:white}.pill-row{display:flex;gap:8px;flex-wrap:wrap}.tiny{border:1px solid #ddd4c4;background:#fffdf8;color:#697064;border-radius:999px;padding:7px 10px;font-size:12px}.tiny.active-filter{background:#20241f;color:#fff;border-color:#20241f}.delete{border:0;background:transparent;color:#9b3f33;font-size:12px;text-align:left;padding:8px 0 0}.source{margin-top:4px;color:#8b8f86;font-size:11px}.group{display:grid;gap:8px}.group-title{margin:8px 2px 0;color:#15574c;font-size:13px;font-weight:900}.group-count{color:#8b8f86;font-size:11px;font-weight:700;margin-left:4px}.vaccine-card{padding:12px 14px}.vaccine-card b{font-size:14px}.vaccine-card span{font-size:12px}.meta-line{display:block;color:#697064;font-size:12px;line-height:1.4}.status-ok{color:#15574c;font-weight:800}.status-check{color:#8a5a16;font-weight:800}.reminder{margin-top:5px;color:#697064;font-size:12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px}.section-title{margin:0;color:#20241f;font-size:15px;font-weight:900}.select{width:100%;border:1px solid #ddd4c4;border-radius:12px;background:#fffdf8;padding:10px;color:#20241f}.area-card{cursor:pointer}.area-card .details{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #ece4d6;color:#697064;font-size:12px;line-height:1.45}.area-card.open .details{display:block}.quiet{color:#8b8f86;font-size:11px}.split-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}

<body>
  <main class="app">
    <section class="profile">
      <button class="avatar" type="button" id="profileButton" aria-label="Profil wechseln">TV</button>
      <div><span class="label">Profil</span><span class="name" id="profileName">Tuba Vogel</span></div>
      <button class="flag" type="button" id="languageButton" aria-label="Sprache wechseln">🇩🇪⌄</button>
      <div class="menu" id="profileMenu"></div><div class="menu" id="languageMenu"></div>
    </section>
    <h1>Gesundheits-Timeline</h1>
    <p class="sub">Vorsorge, Impfausweis und Termine an einem Ort.</p>
    <nav class="tabs" aria-label="Ansicht">
      <button class="tab" data-view="alle">Alle</button><button class="tab" data-view="faellig">Fällig</button><button class="tab" data-view="impfausweis">Impfausweis</button><button class="tab active" data-view="termine">Termine</button>
    </nav>
    <section class="stack" id="content" aria-live="polite"></section>
  </main>
  <script>
    const fallbackData={profiles:[{id:"tuba",name:"Tuba Vogel",initials:"TV"},{id:"caspar",name:"Caspar Vogel",initials:"CV"}],languages:[{code:"de",label:"Deutsch",flag:"🇩🇪"}],careItems:[],vaccinations:[],appointments:[],integrations:{doctolib:{label:"Doctolib",url:"https://www.doctolib.de/"}}};
    const storageKey="gesundheits-prototyp-vaccinations-v1";
    const areaStorageKey="gesundheits-prototyp-health-areas-v1";
    const topicFilters=["Alle","Masern","Hepatitis A","Hepatitis B","HPV","Tollwut","Gelbfieber","Typhus","Polio","COVID","Tetanus"];
    const areaOptions=["Zahnarzt","Blutbild","Gynäkologie","Kardiologie","Onkologie","Hautscreening","Augenärztlich","Orthopädie","Hausarzt-Check-up","Sonstiges"];
    let data=fallbackData,activeProfile="tuba",activeLanguage="de",activeView="termine",vaccineSearch="",calendarStart=new Date(2026,8,21),openAppointment="",openArea="";
    const $=id=>document.getElementById(id),content=$("content"),profileButton=$("profileButton"),profileName=$("profileName"),profileMenu=$("profileMenu"),languageButton=$("languageButton"),languageMenu=$("languageMenu"),tabs=[...document.querySelectorAll(".tab")];
    const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const fmtMonth=d=>d.toLocaleDateString("de-DE",{month:"long",year:"numeric"});
    const loadLocalVaccinations=()=>{try{return JSON.parse(localStorage.getItem(storageKey)||"[]")}catch{return []}};
    const saveLocalVaccinations=items=>localStorage.setItem(storageKey,JSON.stringify(items));
    const loadLocalAreas=()=>{try{return JSON.parse(localStorage.getItem(areaStorageKey)||"[]")}catch{return []}};
    const saveLocalAreas=items=>localStorage.setItem(areaStorageKey,JSON.stringify(items));
    const toothIcon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3.5c1.2 0 2.1.7 3.5.7s2.3-.7 3.5-.7c2.6 0 4.2 2.1 4.2 4.8 0 3.6-1.9 4.7-2.7 8.5-.4 1.9-1.2 3.7-2.6 3.7-1 0-1.1-1.3-1.5-2.7-.2-.8-.5-1.4-.9-1.4s-.7.6-.9 1.4c-.4 1.4-.5 2.7-1.5 2.7-1.4 0-2.2-1.8-2.6-3.7-.8-3.8-2.7-4.9-2.7-8.5 0-2.7 1.6-4.8 4.2-4.8z"/></svg>`;
    const groupOrder=["Reiseimpfungen","HPV","Hepatitis","Standardimpfungen","COVID / zu prüfen","Ältere Einträge"];
    function iconFor(item){if(item.icon==="tooth")return toothIcon;return esc(item.initial||item.date||"")}
    function categoryFor(item){const hay=[item.name,item.note,item.source].join(" ").toLowerCase();if(/typh|gelbfieber|tollwut|rabipur|stamaril|polio|pneumo|prevenar/.test(hay))return "Reiseimpfungen";if(/hpv|gardasil/.test(hay))return "HPV";if(/hepatitis/.test(hay))return "Hepatitis";if(/covid|comirnaty|prüfen|pruefen|detailfoto/.test(hay))return "COVID / zu prüfen";if(/mmr|masern|mumps|roeteln|röteln|tetanus|diphtherie|pertussis|boostrix/.test(hay))return "Standardimpfungen";return "Ältere Einträge"}
    function vaccineInsight(item,all){const hay=[item.name,item.note].join(" ").toLowerCase();const count=needle=>all.filter(x=>[x.name,x.note].join(" ").toLowerCase().includes(needle)).length;let status="Immunisierung dokumentiert",reminder="Nächste Erinnerung: bei Bedarf ärztlich prüfen";if(/hpv|gardasil/.test(hay)){status=count("hpv")>=3?"Immunisierung wahrscheinlich vollständig dokumentiert":"Immunisierung noch unvollständig prüfen";reminder=count("hpv")>=3?"Keine routinemäßige Auffrischung hinterlegt":"Erinnerung: fehlende Dosis ärztlich klären"}else if(/hepatitis a/.test(hay)){status=count("hepatitis a")>=2?"Immunisierung dokumentiert":"Grundimmunisierung prüfen";reminder="Erinnerung: Auffrischung nur bei Risiko/ärztlicher Empfehlung prüfen"}else if(/hepatitis b/.test(hay)){status=count("hepatitis b")>=3?"Grundimmunisierung dokumentiert":"Grundimmunisierung prüfen";reminder="Erinnerung: Titer oder Auffrischung bei Risiko ärztlich prüfen"}else if(/boostrix|tetanus|diphtherie|pertussis/.test(hay)){status="Schutz dokumentiert";reminder="Erinnerung: Tetanus/Diphtherie-Auffrischung spätestens 2028 prüfen"}else if(/mmr|masern|mumps|roeteln|röteln/.test(hay)){status=count("mmr")>=2?"Immunisierung dokumentiert":"Immunisierung prüfen";reminder="Erinnerung: keine routinemäßige Auffrischung hinterlegt"}else if(/gelbfieber|stamaril/.test(hay)){status="Immunisierung dokumentiert";reminder="Erinnerung: meist lebenslang; Einreisevorgaben vor Reisen prüfen"}else if(/tollwut|rabipur/.test(hay)){status="Immunisierung dokumentiert";reminder="Erinnerung: Titer/Auffrischung je nach Reiserisiko prüfen"}else if(/typh|typhim/.test(hay)){status="Reiseimpfung dokumentiert";reminder="Erinnerung: vor Reise prüfen, häufig nach ca. 3 Jahren relevant"}else if(/polio|ipv/.test(hay)){status="Immunisierung dokumentiert";reminder="Erinnerung: Auffrischung bei Reise-/Expositionsrisiko prüfen"}else if(/pneumo|prevenar/.test(hay)){status="Immunisierung dokumentiert";reminder="Erinnerung: Bedarf abhängig von Alter/Risiko ärztlich prüfen"}else if(/covid|comirnaty/.test(hay)){status="COVID-Impfung dokumentiert";reminder="Erinnerung: Auffrischung nach aktueller Empfehlung/Risiko prüfen"}else if(/bcg|tuberkulose/.test(hay)){status="Eintrag dokumentiert";reminder="Erinnerung: keine Standard-Auffrischung hinterlegt"}return{status,reminder}}
    function defaultAreas(){return[{id:"area-zahn",title:"Zahnarzt",initial:"Z",last:"Zahnreinigung 29. Sept. 2026",next:"Nächste Kontrolle in 6 Monaten planen",status:"bald",result:"Letzte Notiz: Zahnreinigung aus Kalender erkannt"},{id:"area-blut",title:"Blutbild",initial:"B",last:"Noch kein Ergebnis hinterlegt",next:"Beim nächsten Check-up anfragen",status:"prüfen",result:"Ergebnisse können später als Laborwerte hinterlegt werden"},{id:"area-gyn",title:"Gynäkologie",initial:"G",last:"4. November 2025",next:"Erinnerung für November 2026",status:"bald",result:"Letzte Ergebnisse lokal ergänzen"}]}
    function allAreas(){return[...defaultAreas(),...loadLocalAreas()]}
    function addLocalArea(){const type=$("areaType").value,last=$("areaLast").value.trim(),next=$("areaNext").value.trim(),result=$("areaResult").value.trim();const items=loadLocalAreas();items.unshift({id:Date.now(),title:type,initial:type.slice(0,1),last:last||"Noch nicht hinterlegt",next:next||"Erinnerung festlegen",status:"prüfen",result:result||"Noch kein Ergebnis hinterlegt"});saveLocalAreas(items);renderContent()}
    function areaCard(x){return `<article class="card area-card ${openArea===String(x.id)?"open":""}" data-area="${esc(x.id)}"><div class="row"><div class="icon">${esc(x.initial||x.title.slice(0,1))}</div><div><b>${esc(x.title)}</b><span>Zuletzt: ${esc(x.last)} · ${esc(x.next)}</span><div class="details">${esc(x.result||"Keine Ergebnisse hinterlegt.")}<br><span class="quiet">Erinnerung: ${esc(x.next)}</span></div></div></div></article>`}
    function renderAreas(onlyDue=false){const areas=allAreas().filter(x=>!onlyDue||["fällig","bald","prüfen"].includes(x.status));const options=areaOptions.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");return `<section class="stack"><div class="section-head"><h2 class="section-title">Weitere Gesundheitsbereiche</h2></div>${areas.map(areaCard).join("")}<article class="card"><div class="form"><select class="select" id="areaType">${options}</select><input class="field" id="areaLast" placeholder="Letzter Termin / letztes Ergebnis"><input class="field" id="areaNext" placeholder="Nächste Erinnerung"><input class="field" id="areaResult" placeholder="Letzte Ergebnisse / Notiz"><div class="split-actions"><button class="action main" type="button" onclick="addLocalArea()">Bereich lokal hinzufügen</button></div></div></article></section>`}
    window.addLocalArea=addLocalArea;
    function addLocalVaccination(){const name=$("vacName").value.trim(),date=$("vacDate").value.trim(),note=$("vacNote").value.trim(),source=$("vacSource").value.trim();if(!name&&!date)return;const items=loadLocalVaccinations();items.unshift({id:Date.now(),name,date,note,source});saveLocalVaccinations(items);renderContent()}
    function deleteLocalVaccination(id){saveLocalVaccinations(loadLocalVaccinations().filter(x=>String(x.id)!==String(id)));renderContent()}
    window.deleteLocalVaccination=deleteLocalVaccination;window.addLocalVaccination=addLocalVaccination;
    function itemCard(item){return `<article class="card"><div class="row"><div class="icon">${iconFor(item)}</div><div><b>${esc(item.title||item.name)}</b><span>${esc(item.last?`Zuletzt: ${item.last} · ${item.next}`:item.details||item.note||"")}</span></div></div></article>`}
    function vaccineCard(x,all){const insight=vaccineInsight(x,all);return `<article class="card vaccine-card"><b>${esc(x.name)}</b><span>${esc(x.date)}</span><div class="meta-line ${insight.status.includes("prüfen")||insight.status.includes("unvollständig")?"status-check":"status-ok"}">${esc(insight.status)}</div><div class="reminder">${esc(insight.reminder)}</div><button class="delete" type="button" onclick="deleteLocalVaccination('${esc(x.id)}')">Eintrag entfernen</button></article>`}
    function groupedVaccines(items){const groups=new Map();items.forEach(item=>{const key=categoryFor(item);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(item)});return groupOrder.filter(key=>groups.has(key)).map(key=>`<section class="group"><div class="group-title">${esc(key)} <span class="group-count">${groups.get(key).length}</span></div>${groups.get(key).map(x=>vaccineCard(x,items)).join("")}</section>`).join("")}
    function renderProfile(){const p=data.profiles.find(x=>x.id===activeProfile)||data.profiles[0],l=data.languages.find(x=>x.code===activeLanguage)||data.languages[0];profileButton.textContent=p.initials;profileName.textContent=p.name;languageButton.textContent=`${l.flag}⌄`;profileMenu.innerHTML=data.profiles.map(x=>`<button class="${x.id===activeProfile?"active":""}" data-profile="${x.id}">${x.initials} · ${esc(x.name)}</button>`).join("")+`<button>+ Person hinzufügen</button>`;languageMenu.innerHTML=data.languages.map(x=>`<button class="${x.code===activeLanguage?"active":""}" data-language="${x.code}">${x.flag} ${esc(x.label)}</button>`).join("")}
    function renderVaccinations(){const local=loadLocalVaccinations();const q=vaccineSearch.toLowerCase();const items=local.filter(x=>[x.name,x.date,x.note,x.source].join(" ").toLowerCase().includes(q));const chips=topicFilters.map(label=>{const query=label==="Alle"?"":label;const active=(vaccineSearch||"")===query;return `<button class="tiny ${active?"active-filter":""}" type="button" data-query="${esc(query)}">${esc(label)}</button>`}).join("");content.innerHTML=`<article class="card"><div class="row"><div class="icon">I</div><div><b>Impfausweis</b><span>Impfungen nach Thema durchsuchen, Immunisierung einschätzen und Erinnerungen vormerken.</span></div></div></article><article class="card privacy"><b>Privater Speicher</b><span>Deine echten Impfdaten bleiben lokal in diesem Browser. Foto-Quellen und Lesbarkeitsnotizen werden hier nicht angezeigt.</span></article><article class="card"><div class="form"><input class="field" id="vacSearch" placeholder="Suchen, z. B. Masern, Hepatitis B, Tollwut" value="${esc(vaccineSearch)}"><div class="pill-row">${chips}</div><input class="field" id="vacName" placeholder="Impfung oder Impfstoff"><input class="field" id="vacDate" placeholder="Datum"><input class="field" id="vacNote" placeholder="Status / Erinnerung"><input class="field" id="vacSource" placeholder="Privater Hinweis, nicht sichtbar"><div class="single-actions"><button class="action main" type="button" onclick="addLocalVaccination()">Lokal speichern</button></div></div></article>${items.length?groupedVaccines(items):`<p class="empty">Keine Einträge für diesen Suchbegriff.</p>`}`;$("vacSearch").oninput=e=>{vaccineSearch=e.target.value;renderVaccinations()};document.querySelectorAll("[data-query]").forEach(btn=>btn.onclick=()=>{vaccineSearch=btn.dataset.query;renderVaccinations()})}
    function renderAppointments(){const appts=data.appointments||[],hitDates=new Set(appts.map(x=>x.date));const days=[0,1,2,3].map(offset=>{const d=new Date(calendarStart);d.setDate(calendarStart.getDate()+offset);return d});const docto=(data.integrations&&data.integrations.doctolib)||fallbackData.integrations.doctolib;content.innerHTML=`<article class="card"><div class="mini-calendar"><div class="cal-head"><button class="nav-btn" type="button" id="prevDays" aria-label="Vorherige Tage">‹</button><span>${esc(fmtMonth(calendarStart))}</span><button class="nav-btn" type="button" id="nextDays" aria-label="Nächste Tage">›</button></div><div class="date-strip">${days.map(d=>`<div class="date-pill ${hitDates.has(iso(d))?"hit":""}"><span>${d.toLocaleDateString("de-DE",{month:"short"})}</span><b>${d.getDate()}</b></div>`).join("")}</div></div></article><article class="card integration"><div class="icon"><img class="doc-icon" src="https://www.doctolib.de/favicon.ico" alt="Doctolib" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="doc-fallback">D</span></div><div><b>Doctolib</b><span>Termine und Buchungen extern verwalten.</span><div class="integration-actions"><a class="link-action" href="${esc(docto.url)}" target="_blank" rel="noopener">Öffnen</a><button class="link-action" type="button" id="importButton">Termine importieren</button></div></div></article>${appts.length?appts.map(x=>`<article class="card appointment ${openAppointment===x.id?"open":""}" data-appt="${esc(x.id)}"><div class="row"><div class="icon">${iconFor(x)}</div><div><b>${esc(x.title)}</b><span>${new Date(x.date+"T12:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"short"})} · ${esc(x.time)} · ${esc(x.details)}</span><div class="details">${esc(x.address)}<br>${esc(x.duration)} · Quelle: ${esc(x.source)}</div></div></div></article>`).join(""):`<p class="empty">Noch keine Termine übernommen.</p>`}`;$("prevDays").onclick=()=>{calendarStart.setDate(calendarStart.getDate()-4);renderAppointments()};$("nextDays").onclick=()=>{calendarStart.setDate(calendarStart.getDate()+4);renderAppointments()};$("importButton").onclick=e=>{e.currentTarget.textContent="Import vorbereiten"};document.querySelectorAll("[data-appt]").forEach(el=>el.onclick=()=>{openAppointment=openAppointment===el.dataset.appt?"":el.dataset.appt;renderAppointments()})}
    function renderContent(){tabs.forEach(t=>t.classList.toggle("active",t.dataset.view===activeView));if(activeView==="alle"){content.innerHTML=(data.careItems.map(itemCard).join("")||`<p class="empty">Noch keine Einträge.</p>`)+renderAreas(false);bindAreaCards()}if(activeView==="faellig"){const due=data.careItems.filter(x=>["fällig","bald","prüfen"].includes(x.status));content.innerHTML=(due.map(itemCard).join("")||`<p class="empty">Aktuell nichts fällig.</p>`)+renderAreas(true);bindAreaCards()}if(activeView==="impfausweis")renderVaccinations();if(activeView==="termine")renderAppointments()}
    function bindAreaCards(){document.querySelectorAll("[data-area]").forEach(el=>el.onclick=()=>{openArea=openArea===el.dataset.area?"":el.dataset.area;renderContent()})}
    function render(){renderProfile();renderContent()}profileButton.onclick=()=>{languageMenu.classList.remove("open");profileMenu.classList.toggle("open")};languageButton.onclick=()=>{profileMenu.classList.remove("open");languageMenu.classList.toggle("open")};profileMenu.onclick=e=>{if(!e.target.dataset.profile)return;activeProfile=e.target.dataset.profile;profileMenu.classList.remove("open");render()};languageMenu.onclick=e=>{if(!e.target.dataset.language)return;activeLanguage=e.target.dataset.language;languageMenu.classList.remove("open");render()};tabs.forEach(t=>t.onclick=()=>{activeView=t.dataset.view;render()});fetch("./data.json?v=health-areas-vaccine-status-2026-09-23").then(r=>r.ok?r.json():fallbackData).then(j=>{data=j;render()}).catch(()=>render());
